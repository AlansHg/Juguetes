<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alan Hinojosa | Catálogo Juguetes</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/estilos.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>
    
    <!-- PANTALLA DE BIENVENIDA -->
    <div id="pantalla-bienvenida">
        <div class="bienvenida-contenido">
            <div class="logo-bienvenida">
                <img src="img/logo.png" alt="Alan Hinojosa" >
            </div>
            <h1>CATÁLOGO JUGUETES</h1>
        </div>
    </div>


    <!-- NAVBAR -->
    <header class="navbar">
        <!-- LOGO -->
        <div class="navbar-logo">
            <div class="logo-circulo">
                <img src="img/logo.png" alt="Logo" >
            </div>
            <div class="logo-texto">
                <strong>Alan Hinojosa</strong>
                <span>
                    CATÁLOGO JUGUETES
                </span>
            </div>
        </div>

        <!-- MENU ESCRITORIO -->
        <nav class="menu-desktop">
            <a href="#inicio">
                Inicio
            </a>
            <a href="#catalogo">
                Catálogo
            </a>
            <a href="#contacto">
                Contacto
            </a>
        </nav>

        <!-- HAMBURGUESA -->
        <button class="boton-menu" id="boton-menu" aria-label="Abrir menú" >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </header>


    <!-- MENU MOVIL -->
    <nav class="menu-movil" id="menu-movil" >
        <a href="#inicio">
            Inicio
        </a>
        <a href="#catalogo">
            Catálogo
        </a>
        <a href="#contacto">
            Contacto
        </a>
    </nav>


    <!-- CONTENIDO -->
    <main id="inicio">

        <!-- HERO -->
        <div class="hero-contenedor" id="hero-contenedor" >
            <div class="hero-slider" id="hero-slider" >
                <!-- JavaScript coloca las portadas -->
            </div>
            <!-- FLECHA IZQUIERDA -->
            <button class="hero-flecha hero-anterior" id="hero-anterior" aria-label="Anterior">
                &#10094;
            </button>
            <!-- FLECHA DERECHA -->
            <button class="hero-flecha hero-siguiente" id="hero-siguiente" aria-label="Siguiente">
                &#10095;
            </button>
            <!-- PUNTOS -->
            <div class="hero-puntos" id="hero-puntos">
            </div>
        </div>


        <!-- CURVA -->
        <div class="curva-hero"></div>


        <!-- CATALOGO -->
        <section class="catalogo" id="catalogo" >
            <!-- CATEGORIAS-->
            <aside class="categorias" id="categorias">
                <!-- JavaScript -->
            </aside>



            <!-- =============================================
                 PRODUCTOS
            ============================================== -->

            <div
                class="contenido-productos"
                id="contenido-productos"
            >

                <!-- JavaScript -->

                <div class="cargando">

                    Cargando catálogo...

                </div>

            </div>


        </section>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer id="contacto">

            <p>
                © 2026 Alan Hinojosa · Catálogo Juguetes
            </p>

        </footer>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/app.js"></script>


</body>

</html>
